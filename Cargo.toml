[package]
name = "mindmap-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "default_fonts",
    "clipboard",
    "links",
    "system_fonts",
] }
egui = { version = "0.37.0", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
